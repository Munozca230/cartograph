[package]
name = "cartograph-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local HTTP server and embedded web map of cartograph"
build = "build.rs"

[dependencies]
axum = "0.8.9"
cartograph-core = { version = "0.1.0", path = "../cartograph-core" }
cartograph-index = { version = "0.1.0", path = "../cartograph-index" }
cartograph-query = { version = "0.1.0", path = "../cartograph-query" }
dunce = "1.0.5"
humantime = "2.4.0"
ignore = "0.4.34"
notify = "8.2.2"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1.44"

[dev-dependencies]
dunce = "1.0.5"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
