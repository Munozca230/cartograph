[package]
name = "cartograph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Architecture map of a code repository: CLI, local web map and MCP server for coding agents"

[[bin]]
name = "cartograph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
cartograph-core = { version = "0.1.0", path = "../cartograph-core" }
cartograph-index = { version = "0.1.0", path = "../cartograph-index" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cartograph-server = { version = "0.1.0", path = "../cartograph-server" }
cartograph-query = { version = "0.1.0", path = "../cartograph-query" }
cartograph-mcp = { version = "0.1.0", path = "../cartograph-mcp" }
serde = "1.0.229"
serde_json = "1.0.154"
open = "5.4.5"
dunce = "1.0.5"
tempfile = "3.27.0"
toml = "1.2.1"

[dev-dependencies]
protobuf = "=3.7.2"
scip = "0.10.0"

