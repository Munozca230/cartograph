[package]
name = "cartograph-query"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only queries and findings over a cartograph graph (shared by CLI, server and MCP)"

[dependencies]
cartograph-core = { version = "0.2.0", path = "../cartograph-core" }
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
cartograph-index = { version = "0.2.0", path = "../cartograph-index" }
tempfile = "3.27.0"
