[package]
name = "cartograph-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stdio MCP server over cartograph-query, for coding agents"

[dependencies]
blake3 = "1.8.7"
cartograph-core = { version = "0.1.0", path = "../cartograph-core" }
cartograph-index = { version = "0.1.0", path = "../cartograph-index" }
cartograph-query = { version = "0.1.0", path = "../cartograph-query" }
cartograph-server = { version = "0.1.0", path = "../cartograph-server" }
dunce = "1.0.5"
open = "5.4.5"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
