repo = "bridges"
question = "How does the renderer's App reach the documents module of the main process?"
tool = "path"
args = { from = "desktop:src/renderer/App.tsx", to = "desktop:src/main/docs.ts" }
contains = ["window.api.saveDoc", "desktop/src/preload/index.ts", "ipc invoke docs:save", "desktop/src/main/docs.ts"]
in_order = true

[[case]]
id = "br-unmatched-dynamic-not-reported"
repo = "bridges"
question = "What IPC is left without its other side?"
tool = "bridges"
args = { kind = "ipc", unmatched = true }
contains = ["nope", "unexposed", "docs:unused", "dynamic"]
budget = 1000

[[case]]
id = "br-package-trap-same-class"
repo = "bridges"
question = "Billing imports com.acme.lib.Money, which two repositories declare: which one does it use?"
tool = "deps"
args = { node = "api:src/main/java/com/acme/api/Billing.java" }
contains = ["lib/src/main/java/com/acme/lib/Money.java"]
not_contains = ["legacy/"]

[[case]]
id = "br-package-findings"
repo = "bridges"
question = "Does the API use code of a repository it does not declare, or an old version of the library?"
tool = "findings"
args = { kind = ["undeclared_member_dependency", "version_skew"] }
contains = ["undeclared_member_dependency:api->legacy", "OldPrices.java", "maven:com.acme:lib", "1.4.0-SNAPSHOT"]

[[case]]
id = "br-impact-over-ipc"
repo = "bridges"
question = "I change the documents module of the main process: what on the renderer side is affected?"
tool = "impact"
args = { nodes = ["desktop:src/main/docs.ts"] }
contains = ["reached over bridges", "desktop/src/preload/index.ts", "desktop/src/renderer/App.tsx"]

[[case]]
id = "br-ts-member-package"
repo = "bridges"
question = "Where does the desktop app's import of @acme/ui-kit lead?"
tool = "deps"
args = { node = "desktop:src/renderer/App.tsx" }
contains = ["ui/src/index.ts"]
not_contains = ["npm:@acme/ui-kit"]

[[case]]
id = "br-http-callers-of-route"
repo = "bridges"
question = "Which client code calls GET /api/users/{id} (UserController.get), in any repository?"
tool = "callers"
args = { symbol = "UserController.get" }
contains = ["over HTTP", "desktop/src/main/http/UsersApi.ts", "web/src/users.ts"]
not_contains = ["UsersApi.me"]
budget = 1000

[[case]]
id = "br-http-findings"
repo = "bridges"
question = "Does every API route the clients call exist, with the method they use?"
tool = "findings"
args = { kind = ["http_unmatched_call", "http_method_mismatch"] }
contains = ["POST /api/reports/generate", "PUT /api/users/me"]
not_contains = ["audit.example.com", "/api/users/search"]

[[case]]
id = "br-http-explain-unmatched"
repo = "bridges"
question = "Which calls of the desktop's users API have no route on the server?"
tool = "explain"
args = { node = "desktop:src/main/http/UsersApi.ts" }
contains = ["left without the other side", "/api/reports/generate"]
budget = 1000

[[case]]
id = "br-http-bridges-unmatched"
repo = "bridges"
question = "What HTTP is left without its other side?"
tool = "bridges"
args = { kind = "http", unmatched = true }
contains = ["unmatched", "method_mismatch", "external", "dynamic", "POST /v2/jobs/{}"]
budget = 1000

[[case]]
id = "br-http-path-client-to-gateway"
repo = "bridges"
question = "How does the web app reach the gateway's jobs router?"
tool = "path"
args = { from = "web:src/users.ts", to = "gateway:src/jobs.ts" }
contains = ["http fetch POST /v1/jobs/{}", "gateway/src/jobs.ts"]

# ---------------------------------------------------------------- Spring DI and slices

[[case]]
id = "spring-callers-interface-list"
repo = "slice"
question = "Who calls PriceRule.discounts, and which beans does Spring inject there?"
tool = "callers"
args = { symbol = "PriceRule.discounts" }
contains = ["PricingEngine.java", "DiscountBoard.java", "List<PriceRule>", "CouponRule", "SeasonRule", "VolumeRule"]
not_contains = ["LegacyRule"]
budget = 1000

[[case]]
id = "spring-callers-primary-and-qualifier"
repo = "slice"
question = "Which payment gateway does the checkout use?"
tool = "callers"
args = { symbol = "PaymentGateway.charge" }
contains = ["CardGateway (@Primary, of 2)", "WireGateway (qualified)"]
budget = 1000

[[case]]
id = "spring-callers-bean-through-interface"
repo = "slice"
question = "Who reaches WireGateway.charge?"
tool = "callers"
args = { symbol = "WireGateway.charge" }
contains = ["CheckoutService.java", "via PaymentGateway.charge (Spring bean)", "reaches another bean"]
budget = 1000

[[case]]
id = "slice-view-to-collection"
repo = "slice"
question = "Show the whole path of saving an order, from the view to the Mongo collection."
tool = "path"
args = { from = "desktop:src/renderer/views/OrderView.tsx", to = "desktop:src/main/api/OrderClient.ts" }
contains = [
  "OrderView.tsx",
  "desktop/src/preload/preload.ts",
  "OrderModule.ts",
  "OrderClient.ts",
  "POST /api/orders",
  "OrderController.java",
  "OrderServiceImpl.java",
  "OrderStore.java",
  "collection orders (Mongo, via Order)",
]
in_order = true
budget = 1500
