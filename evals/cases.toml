# Eval suite of the cartograph MCP tools: `cargo run -p cartograph-cli -- eval`
# (or `cartograph eval evals/cases.toml`). See docs/mcp.md#evals.
#
# Each case is a question an agent would ask, the tool call it would make, facts the
# answer must contain (`contains`, optionally `in_order`) or must not (`not_contains`),
# and a token budget (default: the tool's contract). `error` expects a tool error code.
#
# Why these cases do not rot:
# - Cases on this repository (`self`) assert architectural invariants of the workspace
#   (which crate depends on which, where the binary starts, what a core file is), not
#   counts, line numbers or anything a normal edit changes. They run on the live tree, so
#   they also catch an indexer regression on today's code.
# - Exact facts (counts, rule violations, rankings) live in the synthetic fixtures under
#   tests/fixtures, copied to a temp dir outside any git repository before indexing.
# - Git-dependent tools (diff, check with base, hotspots) run on repositories built at run
#   time from the commits below, with fixed dates and people: no dependence on this
#   repository's history, branch or clone depth.

[repos.self]
path = ".."

[repos.query-app]
fixture = "../tests/fixtures/query-app"

[repos.symbols-ts]
fixture = "../tests/fixtures/symbols-ts"

[repos.inherit-ts]
fixture = "../tests/fixtures/inherit-ts"

[repos.dense-symbols]
fixture = "../tests/fixtures/dense-symbols"

[repos.godot]
fixture = "../tests/fixtures/godot-basic"

[repos.spring-java]
fixture = "../tests/fixtures/spring-java"

# A workspace: four repositories (two in folders named otherwise) mapped as one, with
# data folders and a worktree copy beside them that are never walked.
[repos.workspace]
fixture = "../tests/fixtures/workspace-basic"

# Bridges between members: IPC through a preload and a handler wrapper, a library package
# at an older version, a class two members declare, a member's npm package.
[repos.bridges]
fixture = "../tests/fixtures/workspace-bridges"

# String keys across members (an enum, a registry, a switch, catalogs), and runnable
# tests: a Maven reactor with a wrapper (unit, Spring Boot and slice tests), vitest and
# Playwright.
[repos.keys]
fixture = "../tests/fixtures/workspace-keys"

# Spring DI and a slice from a view to a Mongo collection across three members.
[repos.slice]
fixture = "../tests/fixtures/workspace-slice"

# A layered app. main: an old cycle and an old ui -> db violation. Branch feature: a new
# cycle (model <-> service) and a new core -> ui import. Uncommitted: an unresolved import.
[repos.layered]

[[repos.layered.commits]]
message = "base"

[repos.layered.commits.files]
"cartograph.toml" = '''
[[layers]]
name = "ui"
paths = ["src/ui/**"]
forbid = ["db"]

[[layers]]
name = "core"
paths = ["src/core/**"]
forbid = ["ui"]

[[layers]]
name = "db"
paths = ["src/db/**"]

[rules]
no_cycles = true
'''
"src/db/store.ts" = '''
export const store = 1;
'''
"src/core/model.ts" = '''
import { store } from "../db/store";
export const model = store;
'''
"src/ui/view.ts" = '''
import { model } from "../core/model";
import { store } from "../db/store";
export const view = [model, store];
'''
"src/ui/widget.ts" = '''
export const widget = 2;
'''
"src/legacy/left.ts" = '''
import { right } from "./right";
export const left = () => right;
'''
"src/legacy/right.ts" = '''
import { left } from "./left";
export const right = () => left;
'''

[[repos.layered.commits]]
message = "feature: pricing service"
branch = "feature"

[repos.layered.commits.files]
"src/core/service.ts" = '''
import { model } from "./model";
import { widget } from "../ui/widget";
export const service = [model, widget];
'''
"src/core/model.ts" = '''
import { store } from "../db/store";
import { service } from "./service";
export const model = [store, service];
'''

[repos.layered.worktree]
"src/ui/panel.ts" = '''
import { gone } from "./missing";
export const panel = gone;
'''

# Churn: src/hot.ts changes in all 5 commits and nests deeper each time; src/warm.ts is
# in 3 commits; src/cold.ts in 1.
[repos.churn]

[[repos.churn.commits]]
message = "start"

[repos.churn.commits.files]
"src/hot.ts" = '''
export function hot(x: number) {
  if (x > 0) {
    return 1;
  }
  return 0;
}
'''
"src/warm.ts" = '''
export function warm(x: number) {
  return x;
}
'''
"src/cold.ts" = '''
export const cold = 1;
'''

[[repos.churn.commits]]
message = "hot 2"

[repos.churn.commits.files]
"src/hot.ts" = '''
export function hot(x: number) {
  if (x > 0) {
    for (let i = 0; i < x; i++) {
      if (i % 2) {
        return i;
      }
    }
  }
  return 0;
}
'''
"src/warm.ts" = '''
export function warm(x: number) {
  if (x) {
    return x;
  }
  return 0;
}
'''

[[repos.churn.commits]]
message = "hot 3"

[repos.churn.commits.files]
"src/hot.ts" = '''
export function hot(x: number) {
  if (x > 0) {
    for (let i = 0; i < x; i++) {
      if (i % 2) {
        while (i > 3) {
          return i;
        }
      }
    }
  }
  return 0;
}
'''

[[repos.churn.commits]]
message = "hot 4"

[repos.churn.commits.files]
"src/hot.ts" = '''
export function hot(x: number) {
  if (x > 0) {
    for (let i = 0; i < x; i++) {
      if (i % 2) {
        while (i > 3) {
          if (i > 9) {
            return i;
          }
          i--;
        }
      }
    }
  }
  return 0;
}
'''
"src/warm.ts" = '''
export function warm(x: number) {
  if (x) {
    return x + 1;
  }
  return 0;
}
'''

[[repos.churn.commits]]
message = "hot 5"

[repos.churn.commits.files]
"src/hot.ts" = '''
export function hot(x: number) {
  if (x > 0) {
    for (let i = 0; i < x; i++) {
      if (i % 2) {
        while (i > 3) {
          if (i > 9) {
            switch (i) {
              case 10:
                return i;
            }
          }
          i--;
        }
      }
    }
  }
  return 0;
}
'''

